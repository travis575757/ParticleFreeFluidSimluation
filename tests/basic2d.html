<!doctype html>
<meta charset="utf-8">
<title>basic 2D test</title>
<style>body{margin:0;background:#111} canvas{display:block}</style>
<canvas id="c" width="768" height="768"></canvas>
<script type="module">
import { GLContext } from '../src/gl.js';
import { FluidSim } from '../src/sim.js';
import { header } from '../src/shaders/common.js';

const q = new URLSearchParams(location.search);
const N = Number(q.get('n') || 128);
const steps = Number(q.get('steps') || 120);
const every = Number(q.get('every') || 20);
const scene = q.get('scene') || 'ball';
const params = {};
for (const [k, v] of q) if (!['n', 'steps', 'every', 'scene', 'view', 'dump', 'solve'].includes(k)) params[k] = Number(v);

try {
  const canvas = document.getElementById('c');
  const glc = new GLContext(canvas, { preserveDrawingBuffer: true });
  console.log('renderer: ' + glc.renderer + ' | float linear: ' + glc.floatLinear);
  const sim = new FluidSim(glc, { dim: 2, nx: N, ny: N, params });
  const box = { type: 'box', inverted: true, center: [N / 2, N / 2, 0.5], half: [N / 2 - 1, N / 2 - 1, 1] };
  let liquid;
  if (scene === 'ball') liquid = [{ type: 'ball', center: [N / 2, N * 0.62, 0.5], radius: N * 0.18 }];
  else if (scene === 'dam') liquid = [{ type: 'box', center: [N * 0.2, N * 0.3, 0.5], half: [N * 0.2 - 1, N * 0.3 - 1, 1] }];
  else if (scene === 'still') liquid = [{ type: 'box', center: [N / 2, N * 0.2, 0.5], half: [N / 2, N * 0.2, 1] }];
  sim.reset([box], liquid);

  const view = glc.program('view', `${header(2, glc.floatLinear)}
uniform Grid G;
uniform sampler2D uRho, uLiq, uSdf, uVel, uP;
uniform vec2 uRes;
uniform int uView;
out vec4 o;
void main() {
  vec3 x = vec3(gl_FragCoord.xy / uRes * vec2(G.n.xy), 0.5);
  ivec3 c = ivec3(floor(x));
  vec2 rg = fetchC(uRho, G, c).rg;
  float sd = sampleFast(uSdf, G, x).w;
  vec3 col;
  if (uView == 0) col = mix(vec3(0.05, 0.06, 0.09), vec3(0.2, 0.55, 1.0), clamp(rg.r, 0.0, 1.0)) + vec3(1.0, 0.2, 0.1) * clamp(rg.r - 1.0, 0.0, 1.0);
  else if (uView == 1) col = vec3(0.5) + vec3(1.0, -1.0, -1.0) * (rg.g - 1.0);
  else if (uView == 2) col = vec3(fetchC(uP, G, c).r * 0.02);
  else col = abs(fetchC(uVel, G, c).xyz) * 0.01;
  if (sd < 0.0) col = mix(col, vec3(0.45), 0.8);
  o = vec4(col, 1.0);
}`);
  const draw = () => glc.draw(view, null, { G: sim.grid, uRho: sim.rho, uLiq: sim.liq, uSdf: sim.T.sdf, uVel: sim.vel, uP: sim.pressure,
    uRes: [canvas.width, canvas.height], uView: Number(q.get('view') || 0) });

  const fmt = (s) => `step ${String(s.frame).padStart(4)}  mass ${(s.massRatio * 100).toFixed(5)}%  vol ${(s.volumeRatio * 100).toFixed(2)}%` +
    `  gamma [${s.gammaMin.toFixed(3)}, ${s.gammaMax.toFixed(3)}]  rho'max ${s.maxRhoP.toFixed(3)}  CFL ${s.cfl.toFixed(2)}  res ${s.residual.toExponential(2)}`;
  console.log(fmt(sim.measureSync()));
  let gmin = Infinity, gmax = -Infinity;
  const t0 = performance.now();
  for (let i = 1; i <= steps; i++) {
    sim.step();
    if (i % every === 0 || i === steps) {
      const s = sim.measureSync();
      console.log(fmt(s));
      if (!Number.isFinite(s.mass)) throw new Error('non-finite mass');
      if (s.gammaMin !== Infinity) { gmin = Math.min(gmin, s.gammaMin); gmax = Math.max(gmax, s.gammaMax); }
    }
  }
  glc.finish();
  console.log(`${steps} steps in ${(performance.now() - t0).toFixed(0)} ms (incl. sync readbacks), ${glc.passCount} passes total; gamma range over run [${gmin.toFixed(3)}, ${gmax.toFixed(3)}]`);
  draw();
  if (q.get('solve')) {
    // multigrid convergence study on the last step's system, starting from p = 0
    glc.clear(sim.levels[0].p[0]);
    let prev = sim.measureSync().residual;
    let line = `V-cycle residuals (rel. L1) from p=0: ${prev.toExponential(2)}`;
    for (let i = 0; i < Number(q.get('solve')); i++) {
      sim._vcycle(0);
      const r = sim.measureSync().residual;
      line += ` -> ${r.toExponential(2)} (x${(r / prev).toFixed(2)})`;
      prev = r;
    }
    console.log(line);
  }
  if (q.get('dump')) {
    const [x0, y0, w, hh] = q.get('dump').split(',').map(Number);
    const g = sim.grid;
    const rd = (t) => ({ d: glc.read(t), ch: t.channels });
    const F = { rho: rd(sim.rho), vel: rd(sim.vel), p: rd(sim.pressure), liq: rd(sim.liq), rhs: rd(sim.levels[0].rhs), W: rd(sim.levels[0].W), cA: rd(sim.levels[0].cA), frac: rd(sim.T.frac) };
    const at = (f, x, y, c) => f.d[(y * g.w + x) * f.ch + c];
    const show = (name, f, c, digits = 3) => {
      console.log(`-- ${name} (rows top to bottom, x=${x0}..${x0 + w - 1}, y=${y0 + hh - 1}..${y0})`);
      for (let y = y0 + hh - 1; y >= y0; y--) {
        let line = '';
        for (let x = x0; x < x0 + w; x++) line += at(f, x, y, c).toFixed(digits).padStart(digits + 7);
        console.log(line);
      }
    };
    show('rho', F.rho, 0); show('gamma', F.rho, 1); show('u', F.vel, 0); show('v', F.vel, 1); show('p', F.p, 0);
    show('phi', F.liq, 0); show('V', F.frac, 3); show('Wx', F.W, 0); show('Wy', F.W, 1); show('diag', F.cA, 3); show('rhs', F.rhs, 0); show('pmin', F.rhs, 1, 0);
  }
  window.sim = sim;
  window.__done = true;
} catch (e) {
  console.log(String(e.stack || e));
  window.__error = String(e.message || e);
}
</script>
