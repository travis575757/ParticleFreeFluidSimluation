<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>the map of the surface waves (src/world/swell.js)</title>
<canvas id="c" width="64" height="64"></canvas>
<script type="module">
// The map on its own, over a sea of which nothing is stored:
//   the transform and its inverse give the field back
//   a standing wave swings with omega^2 = g q (deep water) and g q tanh(q depth), for waves of
//     12 to 170 cells, and keeps its height (but for the damping asked for)
//   a hump spreads in rings and nothing comes back from the edge of the window
// and over a sea into which a ball of water falls:
//   the solver is the same to the bit with and without the map
//   under solved water the map has the solver's surface, beyond it the waves run on in rings
//   with the sea at rest again the map switches itself off
//   ?n=  &cell=  &time=1 (ms per step of the map at 256, 512 and 1024 texels)
import { GLContext } from '../src/gl.js';
import { World } from '../src/world/world.js';

const q = new URLSearchParams(location.search);
const log = (s) => console.log(s);
let failed = 0;
const check = (ok, what) => { if (!ok) failed++; log(`${ok ? 'PASS' : 'FAIL'}  ${what}`); };

try {
  if (document.readyState !== 'complete') await new Promise((r) => window.addEventListener('load', r));
  const glc = new GLContext(document.getElementById('c'));
  log(`readback ${glc.readback} | ${glc.renderer}`);
  const n = Number(q.get('n') || 256), cell = Number(q.get('cell') || 2);
  const make = (params) => new World(glc, 3, { h: 0.05, water: [{ box: [-1e6, -1e6, 1e6, 1e6], level: 24.25 }], liquid: [] },
    { swell: { n, cell, loss: 0, visc: 0, ...params } });
  const put = (sw, f) => {
    const d = new Float32Array(2 * n * n);
    for (let k = 0; k < n; k++) for (let i = 0; i < n; i++) { const [h, v] = f(i, k); d[2 * (k * n + i)] = h; d[2 * (k * n + i) + 1] = v; }
    glc.upload(sw.Z, d);
    sw.active = true;
    return d;
  };

  // ---- the transform
  {
    const world = make({});
    const sw = world.sim.swell;
    const d = put(sw, (i, k) => [Math.sin(0.37 * i) * Math.cos(0.11 * k) + ((i * 31 + k * 17) % 13) / 13, Math.cos(0.05 * i * k) - 0.3]);
    const f = sw._fft(sw.Z, -1);
    const spec = glc.read(f).slice();
    // one coefficient against the sum it stands for
    const kx = 5, kz = 3;
    let re = 0, im = 0;
    for (let k = 0; k < n; k++) for (let i = 0; i < n; i++) {
      const a = -2 * Math.PI * (kx * i + kz * k) / n, c = Math.cos(a), s = Math.sin(a);
      const x = d[2 * (k * n + i)], y = d[2 * (k * n + i) + 1];
      re += x * c - y * s; im += x * s + y * c;
    }
    const got = [spec[2 * (kz * n + kx)], spec[2 * (kz * n + kx) + 1]];
    const e1 = Math.hypot(got[0] - re, got[1] - im) / Math.hypot(re, im);
    const back = glc.read(sw._fft(f, 1));
    let worst = 0;
    for (let i = 0; i < d.length; i++) worst = Math.max(worst, Math.abs(back[i] / (n * n) - d[i]));
    check(e1 < 1e-4 && worst < 1e-4, `transform: coefficient (${kx}, ${kz}) within ${e1.toExponential(1)} of the sum, there and back within ${worst.toExponential(1)}`);
    world.dispose();
  }

  // ---- standing waves
  const g = 10 / 0.05, dt = 1 / 60;
  for (const [waves, depth] of [[40, 1e6], [16, 1e6], [6, 1e6], [3, 1e6], [6, 16]]) {
    const world = make({ depth });
    const sw = world.sim.swell;
    const L = n * cell, kq = 2 * Math.PI * waves / L;
    const om = Math.sqrt(g * kq * Math.tanh(Math.min(kq * depth, 20)));
    put(sw, (i) => [0.3 * Math.cos(kq * (i + 0.5) * cell), 0]);
    const steps = Math.round(2.5 * (2 * Math.PI / om) / dt);       // two and a half swings
    for (let s = 0; s < steps; s++) sw.step();
    const z = glc.read(sw.Z);
    let worst = 0;
    const c = Math.cos(om * steps * dt), sn = Math.sin(om * steps * dt);
    for (let k = 0; k < n; k++) for (let i = 0; i < n; i++) {
      const a = 0.3 * Math.cos(kq * (i + 0.5) * cell);
      worst = Math.max(worst, Math.abs(z[2 * (k * n + i)] - a * c), Math.abs(z[2 * (k * n + i) + 1] + a * om * sn) / om);
    }
    check(worst < 2e-3, `a wave of ${(L / waves).toFixed(0)} cells over ${depth > 1e5 ? 'deep water' : depth + ' cells of water'} (period ${(2 * Math.PI / om).toFixed(2)} s) after ${steps} steps: within ${worst.toExponential(1)} cells of 0.3 cos(q x) cos(omega t)`);
    world.dispose();
  }

  // ---- a hump: rings, and the edge of the window
  {
    const mid = n / 2, r0 = 6 / cell;
    const hump = (i, k) => [Math.exp(-((i - mid) ** 2 + (k - mid) ** 2) / (2 * r0 * r0)), 0];
    const peak = (z, a, b) => { let m = 0; for (let k = 0; k < n; k++) for (let i = 0; i < n; i++) { const r = Math.hypot(i - mid + 0.5, k - mid + 0.5); if (r >= a && r < b) m = Math.max(m, Math.abs(z[2 * (k * n + i)])); } return m; };
    let world, sw;
    world = make({ loss: 0.25, visc: 0.5 });
    sw = world.sim.swell;
    put(sw, hump);
    for (let s = 0; s < 120; s++) sw.step();
    let z = glc.read(sw.Z);
    const ring = peak(z, 0, n);
    // a wave of 40 cells runs 0.5 sqrt(g * 40 / 2 pi) = 18 cells a second as a group: across half the window and far beyond in this time
    const T = Math.ceil(4 * (n * cell / 2) / 18 * 60);
    for (let s = 0; s < T; s++) sw.step();
    z = glc.read(sw.Z);
    const left = peak(z, 0, n);
    check(ring > 0.02 && ring < 0.6, `a hump of 1 cell: after 2 s rings of ${ring.toFixed(3)} cells`);
    check(left < 0.02 * ring, `${(T / 60).toFixed(0)} s later the waves have left through the edge of the window (${left.toExponential(1)} cells left, ${(left / ring * 100).toFixed(2)} % of the rings)`);
    world.dispose();
  }

  // ---- the hand-over: a ball of water falls into a sea of which nothing is stored
  {
    const level = 24.25, T1 = Number(q.get('t1') || 200);
    const scene = () => ({ h: 0.05, water: [{ box: [-1e6, -1e6, 1e6, 1e6], level }], liquid: [{ type: 'ball', center: [0, level + 30, 0], radius: 6, vel: [0, 0, 0] }] });
    const world = new World(glc, 3, scene(), { swell: { n, cell } });
    const plain = new World(glc, 3, scene(), { params: { swell: 0 } });
    const sim = world.sim, sw = sim.swell;
    for (let i = 0; i < T1; i++) { world.step(); plain.step(); }
    // the solver knows nothing of the map
    const ra = glc.read(sim.rho).slice(), rb = glc.read(plain.sim.rho);
    let same = sim.bricks === plain.sim.bricks && ra.length === rb.length;
    for (let i = 0; same && i < ra.length; i++) same = ra[i] === rb[i];
    check(same && !plain.sim.swell, `the solver is the same with and without the map (${sim.bricks} bricks, ${sim.nHeld} held after ${T1} steps: the densities agree to the bit)`);
    plain.dispose();
    const Z = glc.read(sw.Z).slice(), E = glc.read(sw.E).slice();
    let off = 0, inside = 0, outside = 0, rs = 0;
    const mid = n / 2;
    for (let k = 0; k < n; k++) for (let i = 0; i < n; i++) {
      const t = k * n + i, w = E[4 * t + 1], r = Math.hypot(i - mid + 0.5, k - mid + 0.5) * cell;
      // (thresholds: what LibreWolf reads back is noisy in its last bits, a zero is not exactly zero)
      if (w >= 0.999) { off = Math.max(off, Math.abs(Z[2 * t] - E[4 * t])); inside = Math.max(inside, Math.abs(Z[2 * t])); }
      if (w > 1e-3) rs = Math.max(rs, r);
      else outside = Math.max(outside, Math.abs(Z[2 * t]));
    }
    if (q.get('dbg') === '1') {
      let si = 0, so = 0, ni = 0, no = 0, sb = 0, nb = 0;
      for (let t = 0; t < n * n; t++) { const w = E[4 * t + 1]; if (w >= 0.999) { si += Z[2 * t]; ni++; } else if (w > 1e-3) { sb += Z[2 * t]; nb++; } else { so += Z[2 * t]; no++; } }
      log(`    volume above rest in the map: ${(si * cell * cell).toFixed(0)} cells under solved water (${ni} texels), ${(sb * cell * cell).toFixed(0)} in the blend (${nb}), ${(so * cell * cell).toFixed(0)} beyond (${no} texels, mean ${(so / no).toExponential(2)}); liquid above rest in the solver ${sim.excessSync().toFixed(0)}, absorbed ${sim.absorbed.toFixed(0)}`);
    }
    check(off < 1e-6 && inside > 0.05, `where the water is solved the map has the solver's surface (within ${off.toExponential(1)} cells; waves of up to ${inside.toFixed(2)} cells)`);
    // rings beyond the solved water, and round ones: the solved bricks end further out along the
    // diagonal than along the axes, and the waves come through the same
    const at = (x, z) => {       // h at world (x, z), between the texels
      const fx = (x - sw.origin[0]) / cell - 0.5, fz = (z - sw.origin[1]) / cell - 0.5;
      const i = Math.floor(fx), k = Math.floor(fz), a = fx - i, b = fz - k;
      const g = (ii, kk) => Z[2 * (kk * n + ii)];
      return (g(i, k) * (1 - a) + g(i + 1, k) * a) * (1 - b) + (g(i, k + 1) * (1 - a) + g(i + 1, k + 1) * a) * b;
    };
    let sa = 0, sd = 0, sad = 0, pa = 0, m = 0;
    const far = Math.min(rs + 100, n * cell / 2 - 80);
    for (let r = rs + 4; r < far; r += 1) {
      let a = 0, d = 0;
      for (const [cx, cz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { a += at(r * cx, r * cz) / 4; d += at(r * Math.SQRT1_2 * (cx - cz), r * Math.SQRT1_2 * (cx + cz)) / 4; }
      sa += a * a; sd += d * d; sad += a * d; pa = Math.max(pa, Math.abs(a)); m++;
    }
    const corr = sad / Math.sqrt(sa * sd), ratio = Math.sqrt(sd / sa);
    log(`  solved water out to ${rs.toFixed(0)} cells from the middle; beyond it waves of up to ${outside.toFixed(3)} cells; along the axes and along the diagonals from ${(rs + 4).toFixed(0)} to ${far.toFixed(0)} cells: correlation ${corr.toFixed(3)}, height ${ratio.toFixed(2)} times that along the axes (${pa.toFixed(3)} cells)`);
    check(outside > 0.02 && corr > 0.8 && ratio > 0.7 && ratio < 1.4, `the waves run on in rings beyond the solved water`);
    // ... and when the sea is at rest again nothing is stored and the map is switched off
    let i = T1, gone = 0;
    for (; i < 4000 && (sim.bricks || sw.active); i++) {
      world.step();
      if (sim.bricks) gone = i + 1;
      if (i % 20 === 0) await new Promise((r) => requestAnimationFrame(r));
      if (q.get('dbg') === '1' && i % 250 === 0) log(`    step ${i}: ${sim.bricks} bricks, largest wave ${sw.peak[0].toExponential(2)} cells, ${(sw.peak[1] * sim.params.dt).toExponential(2)} cells per step`);
    }
    check(!sim.bricks && !sw.active, `at rest again: nothing stored from step ${gone}, the map switched off at step ${i}`);
    world.dispose();
  }

  // ---- what a step of the map costs (&time=1)
  if (q.get('time') === '1') {
    for (const nn of [256, 512, 1024]) {
      const world = new World(glc, 3, { h: 0.05, water: [{ box: [-1e6, -1e6, 1e6, 1e6], level: 24.25 }], liquid: [] }, { swell: { n: nn, cell } });
      const sw = world.sim.swell;
      sw.active = true;
      for (let s = 0; s < 20; s++) sw.step();
      glc.read(sw.D, 0, 0, 1, 1);
      const t0 = performance.now();
      for (let s = 0; s < 200; s++) sw.step();
      glc.read(sw.D, 0, 0, 1, 1);
      log(`  a step of the map of ${nn} x ${nn} texels: ${((performance.now() - t0) / 200).toFixed(3)} ms (${4 * Math.log2(nn) + 3} passes)`);
      world.dispose();
    }
  }
  log(failed ? `${failed} check(s) failed` : 'all checks passed');
} catch (e) {
  console.log('ERROR ' + (e.stack || e));
  window.__error = String(e);
}
window.__done = true;
</script>
